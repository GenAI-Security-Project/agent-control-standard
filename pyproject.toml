[project]
name = "acs"
version = "0.1.4"
description = "ACS Documentation"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [ "mike>=1.2.0", "mkdocs-material>=9.6.14", "pymdown-extensions>=11.0.1",]

[dependency-groups]
dev = [ "pytest>=8.0", "jsonschema>=4.25.0",]
# Workflow security analysis, run by .github/workflows/zizmor.yml. A named group rather
# than dev, so the docs build and the test gate never install it. The lockfile pins the
# version with hashes, and Dependabot moves it under the usual cooldown.
zizmor = [ "zizmor>=1.30.1",]
# The verdict evidence controls in tests/test_verdict_evidence_controls.py, run by
# .github/workflows/verdict-evidence-controls.yml. A named group, like zizmor, so the
# docs build and the guard job never install it. The lockfile pins the commit.
verdict-evidence = [ "agent-evidence-vectors",]

[tool.pytest.ini_options]
# The deploy workflow runs a bare `uv run pytest -v` as the gate the site build
# depends on, in the environment `uv sync --locked` produces. Without this,
# pytest collects the whole repository, so any suite whose dependencies are not
# in uv.lock fails at collection and takes the deploy down with it. Scoping
# collection to tests/ keeps that gate about the guards it was written for.
# Suites that carry their own dependencies run from their own workflow.
testpaths = ["tests"]

[tool.uv.sources]
# Pinned to the commit that carries the controls until a release on PyPI does.
agent-evidence-vectors = { git = "https://github.com/probityai/agent-evidence-vectors", rev = "9b2a003ce4812d2402b85e0a5792c2f60d8d4e8c" }
