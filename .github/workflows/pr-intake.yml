# Decides whether each pull request has an accepted issue behind it, queues the ones that
# do not, and says why once. The logic lives in tools/pr_intake.py, which this job runs as
# one step. Version 2.0. Owner: ACS project leads.
#
# pull_request_target is used deliberately: GITHUB_TOKEN is read-only on a pull_request
# event from a fork, and every external contribution is a fork. That trigger runs with the
# base repository's token, so the job checks out the pull request's base ref, never the
# head. main, integration, and release/* are ruleset-protected, and the job's if: admits
# no other base, so only code a lead approved runs beside the token. The tool reads
# titles, bodies, and comments through the API as data. Its env carries GH_TOKEN, the
# number, the event name and action, the dispatch inputs, and three repository variables,
# nothing else.
#
# pull_request_review gets a read-only token when the pull request comes from a fork, so
# on a fork's pull request the tool decides, writes nothing, prints a notice, and exits 0,
# and the nightly sweep applies the decision. A same-repository pull
# request is cleared on the review itself.
#
# The nightly sweep runs at 03:10 UTC so the 04:10 roadmap sweep can report the same
# night's pass. That ordering is best effort: roadmap-refresh.yml records scheduler start
# delays of up to two hours on this repository.
#
# PR_INTAKE_ENFORCED and PR_INTAKE_TOOL_SHA arm enforcement. Unsetting PR_INTAKE_ENFORCED
# is the kill switch, and the tool then runs only the legacy pass. PR_INTAKE_LANDED is the
# day enforcement started, set in the same sitting. It changes one sentence of the comment
# on older pull requests and arms nothing.
# tests/test_pr_intake_workflow.py pins this file.
name: PR intake

on:
  # zizmor flags every pull_request_target. This one checks out a protected base ref,
  # never the pull request head, so no code from the pull request runs with the token.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened, ready_for_review, synchronize, unlabeled, auto_merge_enabled]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "One pull request to evaluate or retract. Empty means every open pull request."
        type: string
        required: false
      mode:
        description: "evaluate applies the gate. dryrun prints every decision and writes nothing. retract undoes the queue."
        type: choice
        options: [evaluate, dryrun, retract]
        default: evaluate
      authors:
        description: "Whose pull requests a retraction reaches. bots means only known bot authors."
        type: choice
        options: [all, bots]
        default: all

permissions: {}

concurrency:
  group: ${{ github.event.pull_request.number && format('pr-intake-{0}', github.event.pull_request.number) || inputs.pr_number && format('pr-intake-{0}', inputs.pr_number) || 'pr-intake-sweep' }}
  # A newer event re-reads every fact, so an older event run is safe to cancel. A sweep
  # or a dispatch is never cancelled, because it is attended and reports a summary.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  intake:
    name: PR intake
    # Pull request events run only against a protected base, and an edit runs only when
    # it changed the body, the title, or the base.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      ((github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'integration' ||
      startsWith(github.event.pull_request.base.ref, 'release/')) &&
      (github.event.action != 'edited' || github.event.changes.body || github.event.changes.title ||
      github.event.changes.base))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read        # check out the base ref the tool runs from
      pull-requests: write  # comment, set and clear the queue label, and turn auto-merge off
      issues: read          # list accepted and milestoned issues and read claim comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base ref on pull request events. The default branch on schedule and dispatch.
          ref: ${{ github.event.pull_request.base.ref || 'integration' }}
      - name: Run the intake gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          INTAKE_MODE: ${{ inputs.mode || 'evaluate' }}
          INTAKE_AUTHORS: ${{ inputs.authors || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_INTAKE_ENFORCED: ${{ vars.PR_INTAKE_ENFORCED }}
          PR_INTAKE_TOOL_SHA: ${{ vars.PR_INTAKE_TOOL_SHA }}
          PR_INTAKE_LANDED: ${{ vars.PR_INTAKE_LANDED }}
        run: python3 -I -S tools/pr_intake.py
