# The published $id URIs are a machine-consumed contract. Between merges nothing else
# checks that they still resolve, so this does.
name: Monitor Pages

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # 44 checks at six attempts of ten seconds apiece can run well over half an hour
    # during a real outage. Without a limit, a failing run holds the runner against
    # GitHub's six-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A scheduled workflow runs from the default branch. Once the default moves to
          # integration, checking out the default here would verify integration's schema
          # set against a site that publishes from main, failing every six hours between
          # promotions. The site publishes from main regardless of which branch is
          # default, so this must always check out main.
          ref: main

      - name: Verify the published schemas still resolve
        env:
          PAGE_URL: https://genai-security-project.github.io/agent-control-standard/
        run: |
          python3 tools/verify_published.py "${PAGE_URL%/}/schema" --from specification
