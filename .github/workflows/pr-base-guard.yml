# Lets only promotions reach the branch that publishes on merge. tools/base_branch_guard.py
# says what counts as a promotion and why.
#
# pull_request_target runs this workflow and the guard as they stand on main, so a pull
# request cannot rewrite the check that judges it. That trigger is dangerous only when a
# job runs code from the pull request, and this one never does: it checks out main, fetches
# the pull request's head as git objects, and compares trees with git plumbing. The token is
# read-only and is not persisted.
#
# The job id below is the check run name the protect-main ruleset requires. Renaming the
# job without renaming the required check leaves a required status check that never
# reports, which blocks every pull request to main permanently.
name: PR base guard

on:
  # zizmor flags every pull_request_target. The paragraph above is why this one is safe.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: ["main"]
    # edited covers a pull request whose base is changed to main after it was opened.
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-base-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base-branch-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out main's guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Nothing here pushes with git, so the checkout's token has no reason to
          # stay behind in .git/config.
          persist-credentials: false
          # main and integration both have to be present to merge and compare.
          fetch-depth: 0

      - name: Fetch the pull request's head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          # A force push after this event can make its head unreachable. The event for
          # that push runs the guard again, so failing here costs nothing.
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Allow only promotions
        env:
          # Passed through the environment rather than interpolated into the shell. A
          # head ref is contributor-controlled text and ${{ }} inside run: executes.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The live tips, not the event's base, because the merge happens against
          # whatever main is when it lands.
          MAIN_REF: origin/main
          INTEGRATION_REF: origin/integration
          GIT_NO_REPLACE_OBJECTS: "1"
        run: python3 tools/base_branch_guard.py
