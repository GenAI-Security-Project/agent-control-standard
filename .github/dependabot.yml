# Dependabot version updates.
#
# Security updates are enabled separately in repository settings and fire on
# advisories regardless of this file. This config covers routine version
# drift, so a dependency is current before it becomes a CVE. Bun is the
# exception: Dependabot has no security updates for it, so the Bun entry below
# is the only automated update path for the AGT reference implementation.
#
# Every ecosystem sets a cooldown. A compromised release is most dangerous in
# the hours after publication, and registry takeovers are usually caught and
# yanked within days. Waiting before proposing a bump costs nothing here and
# keeps a poisoned version from landing in a PR that looks routine.

version: 2
# No target-branch key. Dependabot follows the default branch, which is `integration`,
# so both routine and security updates land there and never meet the base-branch guard.
# Setting target-branch would make this depend on undocumented security-update targeting
# behavior for no benefit.
updates:
  # GitHub Actions run with write access to the repository. Actions are pinned
  # to commit SHAs in the workflows, and Dependabot understands SHA pins and
  # updates them along with the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Python dependencies resolved through uv.lock. The only runtime surface is
  # the documentation build and the version-sync script.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      # Patch and minor bumps for the docs toolchain land as one PR. Majors
      # stay separate, since mkdocs-material majors have broken builds before.
      docs-toolchain:
        patterns:
          - "mkdocs*"
          - "mike"
          - "pymdown-extensions"
        update-types:
          - "minor"
          - "patch"

  # The AGT reference implementation is a Bun workspace. Dependabot reads the
  # workspace list from the root package.json, so this one entry covers every
  # package and host under it and updates bun.lock in the same PR.
  - package-ecosystem: "bun"
    directory: "/reference-implementations/agt"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # agt.lock pins this SDK to the vendored AGT commit, and test/pin.test.ts
      # fails when package.json and the lock disagree. The SDK moves together
      # with agt_ref as one deliberate change, so a Dependabot bump of the SDK
      # alone would always go red in CI.
      - dependency-name: "agent-control-specification*"

  # The adapters are their own uv project, with their own lockfile, so the docs
  # build never resolves NAT's dependency tree.
  - package-ecosystem: "uv"
    directory: "/adapters"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # Go modules of the Go reference Guardian, so module updates arrive without
  # anyone touching the tree. The weekly run of reference-implementation-go.yml
  # covers advisories for the Go toolchain, which Dependabot does not move.
  - package-ecosystem: "gomod"
    directories:
      - "/reference-implementations/agt-go"
      - "/reference-implementations/agt-go/examples/custom-engine"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      # The two modules share dependencies, and make check fails while one
      # go.mod is ahead of the other, so one version update moves a dependency
      # in both directories. A security update is not grouped and can move one
      # directory alone; make check then fails until the other follows.
      go-modules:
        patterns:
          - "*"
        group-by: dependency-name

  # Base images of the Go reference Guardian's Dockerfile. The FROM lines pin
  # each image by digest, so a moved tag never changes a base image. This entry
  # opens a pull request when an image is rebuilt or gets a newer tag. A new
  # golang tag must match the go line of both go.mod files, which
  # scripts/check-tracked-files.sh enforces. The rust image supplies rustup
  # and the build tools; agt-native.lock selects the Rust toolchain.
  - package-ecosystem: "docker"
    directory: "/reference-implementations/agt-go"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
