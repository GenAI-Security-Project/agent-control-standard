<section id="your-inventories" class="view" hidden>
  <div class="section-heading">
    <h2>Local BOMs</h2>
    <button type="button" id="refresh-inventories">Refresh local inventory</button>
  </div>
  <p class="muted explanation">Open an ACS inventory, a CycloneDX AgBOM, or a model AIBOM from the local inventory folder.</p>
  <div id="local-notices" class="diagnostics" role="status"></div>
  <div id="personal-inspector" hidden>
    <div class="select-field">
      <label for="agbom">Select a BOM</label>
      <select id="agbom"></select>
    </div>
    <div id="personal-artifacts"></div>
    <div id="inventory-notices"></div>
    <div id="personal-filters"></div>
    <div id="personal-evidence"></div>
  </div>
  <div id="personal-comparison"></div>
  <div id="personal-history"></div>
  <div id="personal-events"></div>
</section>
