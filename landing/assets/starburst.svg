<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" fill="none"
     class="acs-starburst"
     role="img"
     font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
     aria-label="Six ACS hooks routed through a central Guardian">
  <style>
    .acs-glow,
    .acs-ring {
      transform-box: view-box;
      transform-origin: 340px 340px;
    }
    .acs-ring {
      vector-effect: non-scaling-stroke;
    }
    .acs-particle {
      offset-distance: 50%;
    }
    .acs-particle--1 { offset-path: path("M340,340 Q356,197 340,80"); }
    .acs-particle--2 { offset-path: path("M340,340 Q471.84,282.36 565.17,210"); }
    .acs-particle--3 { offset-path: path("M340,340 Q455.84,425.36 565.17,470"); }
    .acs-particle--4 { offset-path: path("M340,340 Q324,483 340,600"); }
    .acs-particle--5 { offset-path: path("M340,340 Q208.16,397.64 114.83,470"); }
    .acs-particle--6 { offset-path: path("M340,340 Q224.16,254.64 114.83,210"); }

    @keyframes acs-glow-pulse {
      0%, 100% { transform: scale(0.933); }
      50% { transform: scale(1.133); }
    }
    @keyframes acs-orbit-ring {
      0% { transform: scale(1); opacity: 0.2; }
      100% { transform: scale(4); opacity: 0; }
    }
    @keyframes acs-particle-travel {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .acs-starburst .acs-glow {
        animation: acs-glow-pulse 8s ease-in-out infinite;
      }
      .acs-starburst .acs-ring {
        animation: acs-orbit-ring 8s linear infinite;
      }
      .acs-starburst .acs-ring--2 {
        animation-delay: 4s;
      }
      .acs-starburst .acs-particle {
        animation: acs-particle-travel 5s linear infinite backwards;
      }
      .acs-starburst .acs-particle--1 { animation-duration: 5s; animation-delay: 0s; }
      .acs-starburst .acs-particle--2 { animation-duration: 5.3s; animation-delay: 1.5s; }
      .acs-starburst .acs-particle--3 { animation-duration: 5.6s; animation-delay: 3s; }
      .acs-starburst .acs-particle--4 { animation-duration: 5.9s; animation-delay: 4.5s; }
      .acs-starburst .acs-particle--5 { animation-duration: 6.2s; animation-delay: 6s; }
      .acs-starburst .acs-particle--6 { animation-duration: 6.5s; animation-delay: 7.5s; }
    }

    @media (prefers-reduced-motion: reduce) {
      .acs-starburst:not([data-motion="playing"]) .acs-glow,
      .acs-starburst:not([data-motion="playing"]) .acs-ring,
      .acs-starburst:not([data-motion="playing"]) .acs-particle {
        animation: none;
      }
    }

    .acs-starburst[data-motion="playing"] .acs-glow {
      animation: acs-glow-pulse 8s ease-in-out infinite;
    }
    .acs-starburst[data-motion="playing"] .acs-ring {
      animation: acs-orbit-ring 8s linear infinite;
    }
    .acs-starburst[data-motion="playing"] .acs-ring--2 {
      animation-delay: 4s;
    }
    .acs-starburst[data-motion="playing"] .acs-particle {
      animation: acs-particle-travel 5s linear infinite backwards;
    }
    .acs-starburst[data-motion="playing"] .acs-particle--1 { animation-duration: 5s; animation-delay: 0s; }
    .acs-starburst[data-motion="playing"] .acs-particle--2 { animation-duration: 5.3s; animation-delay: 1.5s; }
    .acs-starburst[data-motion="playing"] .acs-particle--3 { animation-duration: 5.6s; animation-delay: 3s; }
    .acs-starburst[data-motion="playing"] .acs-particle--4 { animation-duration: 5.9s; animation-delay: 4.5s; }
    .acs-starburst[data-motion="playing"] .acs-particle--5 { animation-duration: 6.2s; animation-delay: 6s; }
    .acs-starburst[data-motion="playing"] .acs-particle--6 { animation-duration: 6.5s; animation-delay: 7.5s; }

    .acs-starburst[data-motion="paused"] .acs-glow,
    .acs-starburst[data-motion="paused"] .acs-ring,
    .acs-starburst[data-motion="paused"] .acs-particle {
      animation-play-state: paused;
    }
  </style>
  <defs>
    <radialGradient id="acs-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle class="acs-glow" cx="340" cy="340" r="150" fill="url(#acs-glow)" color="var(--acs-hex-stroke)"/>

  <!-- Orbit rings expand outward on an eight second cycle, offset by half. -->
  <circle class="acs-ring acs-ring--1" cx="340" cy="340" r="60" fill="none" stroke="var(--acs-hex-stroke)" stroke-width="0.5" opacity="0"/>
  <circle class="acs-ring acs-ring--2" cx="340" cy="340" r="60" fill="none" stroke="var(--acs-hex-stroke)" stroke-width="0.5" opacity="0"/>

  <!-- One group per node, each a hook name: a dashed quadratic spoke, a particle traveling it, the node,
       and a two-line label. Particle begin times stagger by 1.5s so traffic reads as
       continuous rather than synchronized. -->
  <g>
    <path d="M340,340 Q356,197 340,80" stroke="var(--acs-spoke)" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <circle class="acs-particle acs-particle--1" cx="0" cy="0" r="3.5" fill="var(--acs-node-stroke)" opacity="0.7"/>
    <circle cx="340" cy="80" r="48" fill="var(--acs-node-fill)" stroke="var(--acs-node-stroke)" stroke-width="2"/>
    <text x="340" y="75" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">User</text>
    <text x="340" y="96" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">message</text>
  </g>
  <g>
    <path d="M340,340 Q471.84,282.36 565.17,210" stroke="var(--acs-spoke)" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <circle class="acs-particle acs-particle--2" cx="0" cy="0" r="3.5" fill="var(--acs-node-stroke)" opacity="0.7"/>
    <circle cx="565.17" cy="210" r="48" fill="var(--acs-node-fill)" stroke="var(--acs-node-stroke)" stroke-width="2"/>
    <text x="565.17" y="205" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">Tool</text>
    <text x="565.17" y="226" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">call</text>
  </g>
  <g>
    <path d="M340,340 Q455.84,425.36 565.17,470" stroke="var(--acs-spoke)" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <circle class="acs-particle acs-particle--3" cx="0" cy="0" r="3.5" fill="var(--acs-node-stroke)" opacity="0.7"/>
    <circle cx="565.17" cy="470" r="48" fill="var(--acs-node-fill)" stroke="var(--acs-node-stroke)" stroke-width="2"/>
    <text x="565.17" y="465" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">Agent</text>
    <text x="565.17" y="486" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">response</text>
  </g>
  <g>
    <path d="M340,340 Q324,483 340,600" stroke="var(--acs-spoke)" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <circle class="acs-particle acs-particle--4" cx="0" cy="0" r="3.5" fill="var(--acs-node-stroke)" opacity="0.7"/>
    <circle cx="340" cy="600" r="48" fill="var(--acs-node-fill)" stroke="var(--acs-node-stroke)" stroke-width="2"/>
    <text x="340" y="595" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">Sub</text>
    <text x="340" y="616" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">agent</text>
  </g>
  <g>
    <path d="M340,340 Q208.16,397.64 114.83,470" stroke="var(--acs-spoke)" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <circle class="acs-particle acs-particle--5" cx="0" cy="0" r="3.5" fill="var(--acs-node-stroke)" opacity="0.7"/>
    <circle cx="114.83" cy="470" r="48" fill="var(--acs-node-fill)" stroke="var(--acs-node-stroke)" stroke-width="2"/>
    <text x="114.83" y="465" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">Memory</text>
    <text x="114.83" y="486" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">store</text>
  </g>
  <g>
    <path d="M340,340 Q224.16,254.64 114.83,210" stroke="var(--acs-spoke)" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <circle class="acs-particle acs-particle--6" cx="0" cy="0" r="3.5" fill="var(--acs-node-stroke)" opacity="0.7"/>
    <circle cx="114.83" cy="210" r="48" fill="var(--acs-node-fill)" stroke="var(--acs-node-stroke)" stroke-width="2"/>
    <text x="114.83" y="205" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">Skill</text>
    <text x="114.83" y="226" text-anchor="middle" fill="var(--acs-text-soft)" font-size="17">load</text>
  </g>

  <g>
    <polygon points="340,272 398.89,306 398.89,374 340,408 281.11,374 281.11,306"
             fill="var(--acs-hex-fill)" stroke="var(--acs-hex-stroke)" stroke-width="2"/>
    <polygon points="340,291.04 382.4,315.52 382.4,364.48 340,388.96 297.6,364.48 297.6,315.52"
             fill="none" stroke="var(--acs-hex-stroke)" stroke-width="0.5" opacity="0.4"/>
    <text x="340" y="336" text-anchor="middle" fill="var(--acs-text)" font-size="18">ACS</text>
    <text x="340" y="356" text-anchor="middle" fill="var(--acs-text)" font-size="18">Guardian</text>
  </g>
</svg>
