# Runnable local configuration.
# Sessions are in memory; audit files contain raw ACS envelopes.
server:
  host: 127.0.0.1
  port: "8787"
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 2m
  shutdown_grace: 10s

policy:
  deployment_dir: ../agt
  manifest: policy/manifest.yaml
  mapping: mapping.yaml
  evaluator: agt
  opa_path: .acs/agt/bin
  opa_timeout: 4s
  ask_substitution: deny
  tool_aliases:
    shell: bash

security:
  hmac_key_id: "2026-10"
  hmac_secret_file: .acs/hmac-secret

storage:
  provider: memory

audit:
  envelope_log: .acs/envelopes.jsonl
  event_log: .acs/guardian-events.jsonl
  max_envelope_file_bytes: 268435456 # 256 MiB; with 3 files, at most 1 GiB; the oldest is deleted
  max_envelope_files: 3
  max_event_file_bytes: 268435456 # 256 MiB; with 8 kept files, at most 2.25 GiB; none deleted, archive them
  max_event_files: 8
  max_queue_records: 4096
  max_queue_bytes: 67108864 # 64 MiB of records waiting for a stalled disk

protocol:
  on_decision_failure: deny
  decision_timeout: 5s
  answer_margin: 500ms # of decision_timeout, kept to record, sign and send the answer
  skew_window: 5m

limits:
  max_sessions: 1024
  max_entries: 10000
  max_reservations: 20000
  max_skill_approvals: 4096
  max_engine_calls: 32
  max_policy_state_bytes: 65536
  max_body_bytes: 1048576
  max_deferrals: 3
  session_retention: 1h
